server:
  port: 8081
  servlet:
    context-path: /gilmok-demo
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

spring:
  application:
    name: demo-backend

  profiles:
    active: dev # 기본 실행 시 application-dev.yml을 읽음 (로컬용)

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true # p95, p99 백분위수 히스토그램 활성화
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics # 메트릭은 항상 노출

gilmok:
  admission:
    jwks-uri: ${GILMOK_ADMISSION_JWKS_URI:http://localhost:8082/gilmok-platform/.well-known/jwks.json}